services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: question-bank-postgres
    environment:
      POSTGRES_USER: kushal
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: question_bank
    ports:
      # Host 5433 → container 5432 (avoids clashing with a local Postgres 17 on 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kushal -d question_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local LLM (OpenAI-compatible on :11434). Pull a model after start:
  #   docker compose --profile ollama exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    container_name: question-bank-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

volumes:
  pgdata:
  ollama_data:
